openapi: 3.0.3
info:
  title: BugLivre API
  description: |
    API JSON do BugLivre (catálogo de mangás). Rotas sob o prefixo `/api`.

    - **Formato**: `application/json`
    - **Autenticação**: Bearer token (opaco) no header `Authorization: Bearer <token>` (stateless)
    - **Leitura do catálogo**: pública
    - **Escrita**: exige perfil `moderador` ou superior (`moderador`, `suporte`, `admin`)

    Envelope de sucesso: `{ success, message, data }`. Erros de validação retornam
    `422` com `errors`; erros de middleware/HTTP retornam `{ status, message }`.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Servidor de desenvolvimento
tags:
  - name: Auth
    description: Autenticação e tokens
  - name: Categories
    description: Categorias de mangá
  - name: Types
    description: Tipos de mangá
  - name: Authors
    description: Autores de mangá
  - name: Mangas
    description: Catálogo de mangás

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registra um usuário e emite um token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Usuário registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica por e-mail ou nome de usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoga o token atual
      description: 'Requer o header `Authorization: Bearer <token>`. Sempre retorna `200`.'
      responses:
        '200':
          description: Sessão encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSuccess' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Revoga o token atual e emite um novo
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenSuccess' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Retorna o usuário do token
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSuccess' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /categories:
    get:
      tags: [Categories]
      summary: Lista categorias
      security: []
      parameters:
        - $ref: '#/components/parameters/OnlyActive'
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListSuccess' }
    post:
      tags: [Categories]
      summary: Cria uma categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategorySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Categories]
      summary: Detalhe da categoria
      security: []
      responses:
        '200':
          description: Categoria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategorySuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categories]
      summary: Atualiza uma categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategorySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Categories]
      summary: Atualiza uma categoria (parcial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategorySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Categories]
      summary: Exclui uma categoria
      responses:
        '200':
          description: Categoria excluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories/{id}/status:
    post:
      tags: [Categories]
      summary: Alterna ativa/inativa
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategorySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /types:
    get:
      tags: [Types]
      summary: Lista tipos de mangá
      security: []
      parameters:
        - $ref: '#/components/parameters/OnlyActive'
      responses:
        '200':
          description: Lista de tipos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaTypeListSuccess' }
    post:
      tags: [Types]
      summary: Cria um tipo de mangá
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MangaTypeInput' }
      responses:
        '201':
          description: Tipo criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaTypeSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /types/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Types]
      summary: Detalhe do tipo
      security: []
      responses:
        '200':
          description: Tipo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaTypeSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Types]
      summary: Atualiza um tipo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MangaTypeInput' }
      responses:
        '200':
          description: Tipo atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaTypeSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Types]
      summary: Atualiza um tipo (parcial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MangaTypeInput' }
      responses:
        '200':
          description: Tipo atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaTypeSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Types]
      summary: Exclui um tipo
      responses:
        '200':
          description: Tipo excluído
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /types/{id}/status:
    post:
      tags: [Types]
      summary: Alterna ativo/inativo
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Tipo atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaTypeSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /authors:
    get:
      tags: [Authors]
      summary: Lista autores
      security: []
      parameters:
        - $ref: '#/components/parameters/OnlyActive'
      responses:
        '200':
          description: Lista de autores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorListSuccess' }
    post:
      tags: [Authors]
      summary: Cria um autor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorInput' }
      responses:
        '201':
          description: Autor criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /authors/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Authors]
      summary: Detalhe do autor
      security: []
      responses:
        '200':
          description: Autor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Authors]
      summary: Atualiza um autor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorInput' }
      responses:
        '200':
          description: Autor atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Authors]
      summary: Atualiza um autor (parcial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorInput' }
      responses:
        '200':
          description: Autor atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Authors]
      summary: Exclui um autor
      responses:
        '200':
          description: Autor excluído
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /authors/{id}/status:
    post:
      tags: [Authors]
      summary: Alterna ativo/inativo
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Autor atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mangas:
    get:
      tags: [Mangas]
      summary: Lista mangás
      security: []
      parameters:
        - name: q
          in: query
          description: Busca por título ou nome do autor
          schema: { type: string }
        - name: category
          in: query
          description: ID da categoria
          schema: { type: integer }
        - name: type
          in: query
          description: ID do tipo de mangá
          schema: { type: integer }
        - $ref: '#/components/parameters/OnlyActive'
      responses:
        '200':
          description: Lista de mangás
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaListSuccess' }
    post:
      tags: [Mangas]
      summary: Cria um mangá
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MangaInput' }
      responses:
        '201':
          description: Mangá criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /mangas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Mangas]
      summary: Detalhe do mangá
      security: []
      responses:
        '200':
          description: Mangá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Mangas]
      summary: Atualiza um mangá
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MangaInput' }
      responses:
        '200':
          description: Mangá atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Mangas]
      summary: Atualiza um mangá (parcial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MangaInput' }
      responses:
        '200':
          description: Mangá atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Mangas]
      summary: Exclui um mangá
      responses:
        '200':
          description: Mangá excluído
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mangas/{id}/status:
    post:
      tags: [Mangas]
      summary: Alterna ativo/inativo
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Mangá atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MangaSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token opaco emitido em `/auth/login`, `/auth/register` ou `/auth/refresh`.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    OnlyActive:
      name: only_active
      in: query
      description: Filtra apenas registros ativos. Aceita `1`, `true` ou `yes`.
      schema: { type: string, enum: ['1', 'true', 'yes'] }

  responses:
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Perfil insuficiente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Exclusão bloqueada por vínculos existentes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    ValidationError:
      description: Erro de validação
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }

  schemas:
    # ---------- Envelopes ----------
    ErrorResponse:
      type: object
      description: Erro de middleware/exceção HTTP.
      properties:
        status: { type: integer, example: 404 }
        message: { type: string, example: "Categoria não encontrada." }
    ValidationError:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Dados inválidos." }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example: { title: ["O título é obrigatório."] }
    MessageSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Sessão encerrada." }
        data: { type: object, nullable: true, example: null }
    TokenData:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: string, example: "2026-12-22 10:00:00" }
    TokenSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Token renovado com sucesso." }
        data: { $ref: '#/components/schemas/TokenData' }
    AuthData:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
        expires_at: { type: string, example: "2026-12-22 10:00:00" }
    AuthSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Login realizado com sucesso." }
        data: { $ref: '#/components/schemas/AuthData' }
    UserSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "OK" }
        data: { $ref: '#/components/schemas/User' }

    # ---------- Entidades ----------
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        email: { type: string }
        role: { type: string, enum: [user, vip, moderador, suporte, admin] }
        role_label: { type: string }
        created_at: { type: string, nullable: true }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
    MangaType:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
    Author:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        bio: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
    Manga:
      type: object
      properties:
        id: { type: integer }
        type_id: { type: integer }
        type_name: { type: string }
        author_id: { type: integer, nullable: true }
        author_name: { type: string, nullable: true }
        title: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        cover: { type: string, nullable: true }
        status: { type: string, enum: [ongoing, completed, hiatus, cancelled] }
        status_label: { type: string, example: "Em publicação" }
        is_active: { type: boolean }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        category_names:
          type: array
          items: { type: string }
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }

    # ---------- Envelopes de listagem/entidade ----------
    CategorySuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "OK" }
        data: { $ref: '#/components/schemas/Category' }
    CategoryListSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "OK" }
        data:
          type: array
          items: { $ref: '#/components/schemas/Category' }
    MangaTypeSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "OK" }
        data: { $ref: '#/components/schemas/MangaType' }
    MangaTypeListSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "OK" }
        data:
          type: array
          items: { $ref: '#/components/schemas/MangaType' }
    AuthorSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "OK" }
        data: { $ref: '#/components/schemas/Author' }
    AuthorListSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "OK" }
        data:
          type: array
          items: { $ref: '#/components/schemas/Author' }
    MangaSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "OK" }
        data: { $ref: '#/components/schemas/Manga' }
    MangaListSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "OK" }
        data:
          type: array
          items: { $ref: '#/components/schemas/Manga' }

    # ---------- Entradas ----------
    RegisterInput:
      type: object
      required: [name, username, email, password]
      properties:
        name: { type: string, minLength: 3, example: "Ana" }
        username: { type: string, pattern: '^[a-zA-Z0-9_.-]{3,60}$', example: "ana" }
        email: { type: string, format: email, example: "ana@exemplo.com" }
        password: { type: string, minLength: 8, format: password }
        password_confirmation: { type: string, format: password }
    LoginInput:
      type: object
      required: [login, password]
      properties:
        login: { type: string, description: "E-mail ou nome de usuário", example: "ana" }
        password: { type: string, format: password }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120, example: "Ação" }
        description: { type: string, maxLength: 1000, nullable: true }
    MangaTypeInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120, example: "Mangá" }
        description: { type: string, maxLength: 1000, nullable: true }
    AuthorInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 150, example: "Kenji" }
        bio: { type: string, maxLength: 3000, nullable: true }
    MangaInput:
      type: object
      required: [type_id, title, category_ids, status]
      properties:
        type_id: { type: integer, description: "ID de um tipo existente" }
        author_id: { type: integer, nullable: true, description: "ID de um autor existente (opcional)" }
        title: { type: string, minLength: 2, maxLength: 200, example: "Exemplo" }
        category_ids:
          type: array
          minItems: 1
          description: "Ao menos uma categoria válida"
          items: { type: integer }
          example: [1, 3]
        description: { type: string, maxLength: 5000, nullable: true }
        cover: { type: string, maxLength: 255, nullable: true, description: "URL absoluta ou caminho iniciado por /", example: "/uploads/covers/2026/11/abc.png" }
        status: { type: string, enum: [ongoing, completed, hiatus, cancelled] }
